worker_processes auto;

# Writable paths all live under /tmp so the container can run as non-root with a
# read-only root filesystem (the chart mounts emptyDirs at /tmp and /runtime-config).
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    server {
        # Tokenised to 9000 by the platform (RepoService '<port-number>' -> 9000), matching the
        # scaffold-platform port contract the .NET/Go scaffolds use.
        listen <port-number>;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # --- Platform health endpoints (WA-D11) ---------------------------------------------
        # EXACT-match blocks placed BEFORE the SPA catch-all, each a bare 200 — otherwise they
        # would fall through try_files to index.html and a probe would get 200 text/html.
        location = /health/startup { access_log off; default_type text/plain; return 200 "healthy\n"; }
        location = /health/live    { access_log off; default_type text/plain; return 200 "healthy\n"; }
        location = /health/ready   { access_log off; default_type text/plain; return 200 "healthy\n"; }

        # --- Runtime config -----------------------------------------------------------------
        # Served for ANY path depth (regex) so a deep-link initial load still resolves env.js.
        # Never cached (it is rewritten per environment at container start). Lives on the
        # writable /runtime-config emptyDir, NOT in the read-only image html root.
        location ~ /env\.js$ {
            alias /runtime-config/env.js;
            add_header Cache-Control "no-store";
            default_type application/javascript;
        }

        # --- Hashed build assets — safe to cache forever ------------------------------------
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- SPA deep-link fallback (WA-R8) — MUST be last ----------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
