name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]

# The build only reads the repository, so its token may do nothing else.
permissions:
  contents: read

jobs:
  # Secret scan (WA-R2): a static SPA ships its entire bundle to the browser, so no secret may
  # ever land in the repo, the same gate as the AzDO pipeline. It runs the MIT gitleaks CLI
  # directly (same image and flags as AzDO): the gitleaks-action wrapper demands a paid
  # GITLEAKS_LICENSE on organisation-owned repos, and every tenant repo is organisation-owned.
  # It guards every branch, before the build.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact -v --config /repo/.gitleaks.toml

  # The shared build, the same for every template: on the main branch it builds the image
  # once and pushes it tagged with its commit (and latest and v1.0.0); on any other branch it
  # only builds. CD deploys that commit's image to every environment.
  build:
    needs: secret-scan
    uses: pellerex-platform/workflows/.github/workflows/ci.yaml@v2
    with:
      # Matches this scaffold's AzDO pipeline artifact identity (ManagedApp, the Managed App
      # Service product type, WA-D5, not ManagedApi). The release side must consume this name.
      project_name: Pellerex.Ecosystem.ManagedApp.RepoUniqueNormalisedIdentifier
      docker_repository: pellerex/RepoUniqueNormalisedIdentifier
    secrets: inherit
